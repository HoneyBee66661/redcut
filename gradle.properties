# --- Gradle ----------------------------------------------------------------
# Heap is deliberately well under 4g. More than one JVM daemon is alive during a
# build (a Gradle daemon per JVM host, plus a Kotlin compile daemon), and both CI
# runners (ubuntu-latest) and small dev boxes have roughly 7 GB in total. At -Xmx4g
# each, two concurrent builds plus their tooling exhausted the machine — and a
# process that cannot fork or allocate hangs in uninterruptible state instead of
# failing the build with an OOM error, which is far harder to diagnose. 1.5 GB is
# comfortably more than this module graph needs to compile.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
# Each module gets its own R class; required for the feature-module structure.
android.nonTransitiveRClass=true
# BuildConfig is opt-in per module — a large multi-module project generates a
# lot of these and most are unused.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- Native ----------------------------------------------------------------
# Expose the CMake build so a native failure is attributable rather than
# surfacing as an opaque packaging error.
android.native.buildOutput=verbose
