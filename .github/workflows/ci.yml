name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Warnings are errors in CI and only in CI. Locally, `allWarningsAsErrors`
  # stays off so scaffolding is not hostile — see KotlinAndroid.kt.
  #
  # Spelled `=true` rather than bare, because Gradle sets a value-less `-Pfoo` to
  # the empty string: the original bare flag read as false and this gate never
  # ran. KotlinAndroid.kt now tolerates both spellings; this one is the honest one.
  GRADLE_FLAGS: -Predcut.warningsAsErrors=true --stacktrace

# NO JOBS ARE PARKED any more. Both un-parked during Phase 0:
#
#   - `build` (Phase 0.2) is the ONLY verification the Android half gets: the
#     development host is aarch64 and Google publishes aapt2 for linux-x86_64 only,
#     so `assembleDebug` cannot run locally at all.
#   - `native` (Phase 0.4) is the only place C++ is compiled, for the same reason
#     (no Android NDK on the host), plus the device checks that need an APK.
#
# Everything else the spec's §11 CI gate list calls for is live: detekt, ktlint,
# unit tests, the `:domain:*` purity check, -Werror on both halves, and the 16 KB
# alignment assertion. Android `lint` and the NFR-7 APK size check are still
# absent, deliberately — see the notes on the `build` job.
#
# tools/verify.sh runs the subset that needs no Android toolchain, which is what
# makes it a gate rather than a summary: three of the four steps below are
# reproducible on the development host.

jobs:
  # Runs first and standalone: it needs no JDK, no SDK, and no network, so it
  # fails in seconds rather than after a ten-minute build. This is the check
  # that protects the deferred C++ core plan (§6.8) and the fast test tier.
  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check domain purity and Media3 isolation
        run: bash tools/check-architecture.sh
      # Same reason this job exists: it needs no SDK and no compile, so it fails in
      # seconds instead of after the `build` job's three minutes. Catches the
      # generated-symbol import mistakes that only `build` can see otherwise.
      - name: Check app-tier imports
        run: bash tools/check-app-imports.sh

  # Static analysis. A separate job from `domain-tests` for one reason: it needs no
  # test execution and no Android SDK, so it can fail in ~40s instead of after a
  # full compile, and its failures are style/smell findings rather than behaviour.
  #
  # The task list is the same list tools/verify.sh runs (`QUALITY_TASKS`), which is
  # what makes a local green mean something.
  quality:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint and detekt
        run: ./gradlew ktlintCheck detekt $GRADLE_FLAGS

  # The fast tier (spec §12.1). Because :domain:* is pure JVM this needs no
  # emulator and no Android SDK — which is the entire point of keeping it pure.
  #
  # This job is the project's primary verification loop: it exercises the whole
  # toolchain end to end (Gradle version, version catalog resolution, build-logic
  # convention plugins compiling against their compileOnly plugin artifacts) and
  # then compiles and tests the domain model. A green run here proves the version
  # matrix in gradle/libs.versions.toml actually resolves.
  domain-tests:
    name: Domain tests (JVM tier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run pure-JVM tests
        # Scoped to the modules that exist — see docs/VIDEO_EDITOR_MVP_SPEC.md §4.1.
        # :domain:render is listed because Phase 1.10 landed it: it holds
        # TimelineCompiler, the one place framing, timing and ordering rules exist, and
        # both the preview and the export path consume its output — so a CI run that
        # did not test it was a green light for the module the whole product depends on.
        # :core:common joined with Phase 0.2; tools/verify.sh runs the same list.
        run: ./gradlew :domain:document:test :domain:render:test :domain:project:test :core:common:test $GRADLE_FLAGS
      - name: Fail if the fast tier got slow
        # The tier is only valuable while it is fast enough to run on every save.
        # If this trips, something impure crept into :domain:*.
        #
        # Budget is 15s, not 5s: this sums the `time` attribute from the JUnit
        # XML, so it excludes Gradle startup and dependency resolution, but a cold
        # runner still pays class-loading and JIT costs that a warm local machine
        # does not. 5s was aspirational and would have failed on a cold cache,
        # which trains people to ignore the check. Tighten once there is a
        # baseline to justify it.
        #
        # `-m1` takes only the FIRST time attribute per file — the `<testsuite>`
        # element. Summing every match also adds each suite's per-case times to the
        # suite total and roughly doubles the number, which would make this budget
        # about twice as lenient as it reads.
        run: |
          TOTAL=$(for f in $(find . -path '*/build/test-results/*' -name '*.xml'); do
            grep -om1 'time="[0-9.]*"' "$f" || true
          done | sed 's/time="//;s/"//' | awk '{s+=$1} END {printf "%.1f", s}')
          echo "Domain test wall time: ${TOTAL}s"
          awk -v t="${TOTAL:-0}" 'BEGIN { exit (t > 15.0) ? 1 : 0 }' \
            || { echo "::error::Domain test tier exceeded 15s budget (spec §12.1)"; exit 1; }

# ---------------------------------------------------------------------------
# PARKED JOBS
#
# Both of these reference modules that do not exist yet. `:app` needs real
# sources before `assembleDebug` has anything to assemble, and `:engine:native`
# is Phase 0.4 (`native/` is currently an empty directory). Un-comment each as
# its phase completes.
#
# Deliberately NOT added here yet, though spec §11 calls for them: detekt,
# ktlint, an APK size check against NFR-7, and `ndk-stack` symbolication. Each
# needs module wiring or build output that does not exist, so adding them now
# would mean four more permanently-red gates. They land with Phase 0.3, once
# there is a green baseline to protect.
# ---------------------------------------------------------------------------

  # `lint` is deliberately absent: a lint gate that fails on day one for
  # scaffolding reasons is a gate everyone learns to bypass. It lands with
  # Phase 0.3 alongside detekt and ktlint.
  build:
    name: Assemble and unit test
    runs-on: ubuntu-latest
    needs: [architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug
        run: ./gradlew assembleDebug $GRADLE_FLAGS
      - name: Verify the native library is packaged
        # `:engine:native` wires CMake only when an Android SDK is present (see its
        # build file for why), so a runner without one would silently ship an APK with
        # no native code — and a green job would mean "assembled nothing native". The
        # `native` job asserts the library's PROPERTIES; this asserts its PRESENCE in
        # the artifact the app actually ships.
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libredcut_core.so' || {
            echo "::error::the debug APK contains no libredcut_core.so — the native build was skipped on this runner"
            exit 1
          }
          echo "native library present"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest $GRADLE_FLAGS
      # The APK is the only path to device verification this project has: there is
      # no emulator or physical device on the development host, so §15's
      # device-level items (startup, scrub, soak export, APK size, TalkBack) are
      # checked by sideloading this artifact. `if-no-files-found: error` because a
      # job that reports success while producing nothing installable is the exact
      # failure this step exists to catch.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: redcut-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**

  # The native half of the build, and the only place C++ is compiled.
  #
  # Every assertion here is invisible until it bites in production:
  #   - the .so is 16 KB page-aligned (risk R5 — without the link flag it fails to
  #     LOAD on Android 15+, a shipping blocker that is invisible on older devices);
  #   - JNI_OnLoad and the registered natives are in the symbol table, so the seam is
  #     registered by name and not by luck;
  #   - debug info survives, so ndk-stack can symbolicate a native crash (§6.7);
  #   - both shipped ABIs are packaged into the APK — a missing ABI is not a build
  #     error, it is a load failure on the devices that use it;
  #   - the Kotlin and C++ ABI versions agree, so the startup handshake cannot be born
  #     broken by a one-sided edit.
  #
  # Separate from `build` on purpose: it downloads an NDK (~1 GB) and pays a CMake
  # configure, and a failure here is a native failure rather than an app one.
  native:
    name: Native build and ABI check
    runs-on: ubuntu-latest
    needs: [architecture]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: JNI ABI versions agree
        # The version lives in two files in two languages. A comment asking people to
        # keep them in step is not a mechanism; this is.
        run: |
          set -euo pipefail
          cpp=$(grep -oE 'kVersionCode = [0-9]+' native/include/redcut/seam.h | grep -oE '[0-9]+')
          kt=$(grep -oE 'EXPECTED_VERSION_CODE: Int = [0-9]+' \
                engine/native/src/main/kotlin/com/redcut/engine/nativecore/NativeContract.kt \
                | grep -oE '[0-9]+')
          echo "C++ kVersionCode=$cpp  Kotlin EXPECTED_VERSION_CODE=$kt"
          if [ -z "$cpp" ] || [ "$cpp" != "$kt" ]; then
            echo "::error::JNI ABI versions disagree ($cpp vs $kt) — the startup handshake would fail at runtime"
            exit 1
          fi
      - name: Build the app with its native library
        # `-Predcut.nativeBuild=true` is explicit rather than inferred from the
        # runner's environment: the module wires CMake when an SDK is present, and
        # this job must FAIL if that inference ever stops holding, not quietly build
        # an app with no native library in it.
        run: ./gradlew assembleDebug $GRADLE_FLAGS -Predcut.nativeBuild=true
      - name: Locate the NDK tools
        run: |
          set -euo pipefail
          NDK=$(ls -d "${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/ndk/"* | head -1)
          echo "resolved NDK=$NDK"
          echo "TOOLBIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
      - name: Verify 16 KB page alignment
        # LLVM tools exit 74 (EX_IOERR) when their stdout is a pipe that closes early,
        # and `set -o pipefail` turns that into a step failure — so readelf's output is
        # captured to a file and parsed from there. Piping it into `head`/`awk … exit`
        # failed this step once while the alignment it printed was already correct
        # (R E 0x4000): the check was fine, the plumbing was not.
        run: |
          set -euo pipefail
          LIB=$(find app/build/intermediates/merged_native_libs -path '*arm64-v8a*' \
                  -name 'libredcut_core.so' | head -1)
          if [ -z "$LIB" ]; then
            echo "::error::libredcut_core.so for arm64-v8a was not packaged into the app"
            exit 1
          fi
          echo "inspecting $LIB"
          "$TOOLBIN/llvm-readelf" -l "$LIB" > /tmp/readelf.txt
          grep -E 'LOAD' /tmp/readelf.txt
          ALIGN=$(awk '/LOAD/ {print $NF; exit}' /tmp/readelf.txt)
          echo "first LOAD segment alignment: $ALIGN"
          if [ "$ALIGN" != "0x4000" ]; then
            echo "::error::expected 0x4000 (16 KB), got $ALIGN — this .so fails to load on Android 15+ devices. Check -Wl,-z,max-page-size=16384 in native/CMakeLists.txt"
            exit 1
          fi
          echo "16 KB alignment OK"
      - name: Verify the registered seam is symbolisable
        # Proves RegisterNatives produced real symbols and that -g survived, which is
        # what makes a native crash a stack trace instead of a guess (§6.7). Same
        # file-not-pipe rule as above: readelf and nm both fail on a closed pipe.
        run: |
          set -euo pipefail
          SO=$(find engine/native/build -path '*obj*' -name 'libredcut_core.so' | head -1)
          if [ -z "$SO" ]; then
            echo "::error::no unstripped libredcut_core.so under engine/native/build — nothing to symbolicate with"
            exit 1
          fi
          echo "unstripped library: $SO"
          "$TOOLBIN/llvm-nm" "$SO" > /tmp/nm.txt
          "$TOOLBIN/llvm-readelf" -S "$SO" > /tmp/sections.txt
          for sym in JNI_OnLoad SeamAdd SeamVersionCode; do
            grep -q "$sym" /tmp/nm.txt || {
              echo "::error::$sym missing from $SO — JNI_OnLoad did not register the seam as expected"
              exit 1
            }
          done
          grep -q '\.debug_info' /tmp/sections.txt || {
            echo "::error::no .debug_info in $SO — ndk-stack could not symbolicate a native crash"
            exit 1
          }
          echo "symbols and debug info present"
      - name: Verify both ABIs are packaged
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK=$APK"
          for abi in arm64-v8a armeabi-v7a; do
            if ! unzip -l "$APK" | grep -q "lib/$abi/libredcut_core.so"; then
              echo "::error::lib/$abi/libredcut_core.so missing from the APK — that ABI would fail to load the library at runtime"
              exit 1
            fi
            echo "  $abi: packaged"
          done
