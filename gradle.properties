# --- Gradle ----------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Android ---------------------------------------------------------------
android.useAndroidX=true
# Each module gets its own R class; required for the feature-module structure.
android.nonTransitiveRClass=true
# BuildConfig is opt-in per module — a large multi-module project generates a
# lot of these and most are unused.
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false

# --- Kotlin ----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true

# --- Native ----------------------------------------------------------------
# Expose the CMake build so a native failure is attributable rather than
# surfacing as an opaque packaging error.
android.native.buildOutput=verbose
