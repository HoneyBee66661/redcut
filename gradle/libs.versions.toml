# RedCut version catalog — the single place versions are declared.
#
# Version policy: pin deliberately, bump in one commit, never inline a version
# string in a module build file.
#
# Every version below was resolved against the real Google/Maven Central
# metadata rather than chosen from memory. The AGP/Gradle pair is the load-bearing
# one: compileSdk 36 requires AGP >= 8.9.1, and AGP 8.9.1 itself requires
# Gradle >= 8.11.1. Bumping one without the other breaks the build.

[versions]
# --- Toolchain -------------------------------------------------------------
# AGP 8.9.1 is the minimum that understands API 36. Deliberately NOT on AGP 9.x:
# 9.0 enables built-in Kotlin by default (making `apply("org.jetbrains.kotlin.android")`
# in build-logic/convention incompatible) and removes several gradle.properties
# flags this project sets. Revisit once CI is green — see docs/VIDEO_EDITOR_MVP_SPEC.md.
agp = "8.9.1"
kotlin = "2.2.21"
ksp = "2.2.21-2.0.5"           # must track `kotlin` exactly
jvmTarget = "17"
ndk = "27.0.12077973"          # NDK r27: C++20, 16 KB page-size capable

# --- Android SDK levels ----------------------------------------------------
# buildToolsVersion is deliberately NOT pinned: AGP selects the correct default
# for its own version, and pinning it adds a CI failure mode when a runner image
# does not happen to ship that exact revision.
compileSdk = "36"
minSdk = "26"                  # spec Appendix-A4: AHardwareBuffer requires 26
targetSdk = "36"               # spec §App-A / header table: Target SDK 36

# --- AndroidX / Compose ----------------------------------------------------
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.3"
composeBom = "2024.10.01"
navigationCompose = "2.8.4"
datastore = "1.1.1"

# --- Media3 (spec §3.1) ----------------------------------------------------
# 1.9.0 is the first release with CompositionPlayer, which the preview
# strategy depends on (spec §8.4). Do not downgrade below this. Verified against
# the Media3 1.9.0 release notes: it introduced CompositionPlayer as
# @ExperimentalApi. On 1.9.4 (same minor, patch-only).
media3 = "1.9.4"

# --- DI / logging ----------------------------------------------------------
# 2.59+ is the floor that supports AGP 9, so this bump means the eventual AGP 9
# migration will not also have to move Hilt.
hilt = "2.59.2"
hiltNavigationCompose = "1.2.0"
timber = "5.0.1"

# --- Serialization ---------------------------------------------------------
# Must stay in step with `kotlin`. Unlike most libraries, this one is not
# backward-tolerant: the Kotlin serialization COMPILER PLUGIN checks the runtime
# version at build time and fails with "kotlinx.serialization core version is too
# low" when it is stale. 1.7.3 predates Kotlin 2.2 and would break
# :domain:document — the one module the fast CI tier depends on.
kotlinxSerialization = "1.9.0"

# --- Testing ---------------------------------------------------------------
junit = "4.13.2"
junit5 = "5.11.3"
kotest = "5.9.1"
turbine = "1.2.0"
truth = "1.4.4"
robolectric = "4.14"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"
benchmark = "1.3.3"

# --- Static analysis -------------------------------------------------------
detekt = "1.23.7"
ktlint = "12.1.1"              # ktlint-gradle plugin

[libraries]
# --- AndroidX core ---------------------------------------------------------
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# --- Compose (BOM-managed; no versions on the individual artifacts) --------
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# --- Media3 ----------------------------------------------------------------
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-transformer = { group = "androidx.media3", name = "media3-transformer", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-common = { group = "androidx.media3", name = "media3-common", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# --- DI / logging ----------------------------------------------------------
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

# --- Serialization ---------------------------------------------------------
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Testing ---------------------------------------------------------------
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit5" }
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# --- Gradle plugin artifacts -----------------------------------------------
# Needed as `compileOnly` classpath entries by build-logic/convention, so the
# convention plugins can reference AGP/Kotlin/Hilt types at compile time.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version.ref = "ksp" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
