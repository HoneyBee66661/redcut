name: Baseline profile

# WHY THIS IS A SEPARATE WORKFLOW, AND WHY IT IS NOT IN ci.yml
#
# Generating a baseline profile needs a booted Android device and several minutes of it.
# ci.yml is the gate every PR passes, and it passes without a device on purpose: a gate
# that needs an emulator is a gate that is slow, flaky, and skipped. So the profile lives
# here — generated on demand, weekly, and whenever the generator or the shipped profile
# changes — and ci.yml merely COMPILES the generator (the quality + build jobs) without
# running it.
#
# This is the same split the spec draws for the test tiers (§12.1): the fast tier runs
# everywhere, the instrumented tier runs where a device exists.
#
# The device is an emulator, and a profile generated on one is valid: ART profiles record
# dex paths, not timings. Timings are the thing an emulator cannot be trusted for, which is
# why no benchmark lives in :benchmark — see the note in benchmark/build.gradle.kts.

on:
  # Manual, for the case that matters in practice: a UI change landed and someone wants
  # the profile refreshed without waiting for Monday.
  workflow_dispatch:
  # Weekly. A profile is regenerated from the app as it exists NOW; the weekly diff is the
  # signal that a screen moved, a path was added, or the profile has gone stale.
  schedule:
    - cron: "0 4 * * 1"   # Mondays, 04:00 UTC
  # On PRs that change the generator or the profile itself. Those are the changes that can
  # break generation, and they are rare — which is what makes an emulator acceptable here.
  pull_request:
    paths:
      - "benchmark/**"
      # Both spellings of the profile's home, because the plugin's output path is the
      # plugin's business: with `mergeIntoMain = true` the files land in
      # `app/src/main/generated/baselineProfiles/`, which the first successful run of this
      # workflow established. The un-suffixed path stays listed for the variant-specific
      # layout the plugin uses when `mergeIntoMain` is off.
      - "app/src/main/baselineProfiles/**"
      - "app/src/main/generated/baselineProfiles/**"
      - "app/src/main/baseline-prof.txt"
      - ".github/workflows/baseline-profile.yml"

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

env:
  # `-Predcut.profileAbi=x86_64` is what makes the app installable on this emulator: the
  # product ships arm64-v8a/armeabi-v7a only (NFR-7), so without it the generation fails at
  # install and reads as a broken profile pipeline rather than as an ABI mismatch.
  GRADLE_FLAGS: >-
    -Predcut.warningsAsErrors=true
    -Predcut.profileAbi=x86_64
    -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR
    --stacktrace

jobs:
  generate:
    name: Generate the profile on an emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Same explicit `packages` as ci.yml's native job, and for the same reason: the action's default
      # asks for `tools`, which Google no longer publishes, so it failed before the emulator started.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      # KVM is what makes an x86_64 emulator usable in a job rather than a time-out. The
      # udev rule is the documented way to make /dev/kvm accessible to the runner user.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # `aosp_atd` is the "automated test device" image: no Play services, no UI chrome,
      # booting in well under a minute. `-no-snapshot` keeps runs comparable, and
      # `-gpu swiftshader_indirect` is the only GPU a hosted runner has.
      - name: Generate the baseline profile
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: >-
            -no-snapshot -noaudio -no-boot-anim -no-window
            -gpu swiftshader_indirect
          script: ./gradlew :app:generateBaselineProfile $GRADLE_FLAGS

      # An empty profile is worse than none: it ships, it looks like a profile, and every
      # later reader assumes the code paths were covered. So the job fails when nothing was
      # written, and it prints what WAS written — the plugin's output path is its business,
      # and the first run of this workflow proved the point: with `mergeIntoMain = true` the
      # profile lands in `app/src/main/generated/baselineProfiles/baseline-prof.txt`, not in
      # `src/main/baselineProfiles/`, and the empty-profile check below had been looking in
      # the wrong place. Both locations are searched; neither is assumed.
      - name: Find the generated profile
        id: profile
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(app/src/main/baselineProfiles/*.txt app/src/main/generated/baselineProfiles/*.txt)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No profile was written under app/src/main. Check that"
            echo "::error:::benchmark:collect*BaselineProfile ran on the emulator."
            exit 1
          fi
          for f in "${files[@]}"; do
            bytes=$(wc -c < "$f")
            rules=$(grep -c . "$f" || true)
            startup=$(grep -c '^HSPL' "$f" || true)
            echo "$f: ${bytes} bytes, ${rules} rules, ${startup} startup markers"
            if [ "$bytes" -eq 0 ]; then
              echo "::error::$f is empty."
              exit 1
            fi
            echo "path=$f" >> "$GITHUB_OUTPUT"
          done

      # The profile is a checked-in input, so the interesting output of this job is the
      # DIFF: what the app's code paths look like today versus what was committed. Printed
      # rather than auto-committed — a generated file that commits itself is a file nobody
      # reviews, and this one is reviewed by design (see the note in app/build.gradle.kts).
      #
      # WHY THE TABLE CARRIES RULE COUNTS AND NOT ONLY BYTES. This generator is not
      # byte-reproducible, and that is inherent rather than a bug: the profile records which
      # methods the instrumented WALK reached, so class loading, emulator speed, and how far a
      # screen had drawn before the walk moved on all decide whether the last few methods of a
      # path land inside the sampling window. Two runs of the SAME code, days apart:
      #   PR #54 run 34919787716: 1708194 bytes, 16870 rules, 13200 startup markers
      #   PR #55 run 34925570837: 1707277 bytes, 16861 rules, 13195 startup markers
      # i.e. -917 bytes (0.05%), -9 rules, -5 markers, with an identical tree. The consequences
      # are what this step exists to absorb: EVERY run reports a non-empty diff against the
      # committed file, a re-run does not converge, and the byte count alone cannot tell "the
      # app changed" from "the emulator got 9 rules further this time". So the rule counts are
      # printed beside the bytes and a verdict is printed under them. Judge by ORDER of
      # magnitude: the last real refresh moved 13846 lines -> ~16870 (the project gallery, the
      # real timeline, the preview and FR-2.10's playback path), hundreds of times this noise.
      - name: Summarise the change
        run: |
          set -uo pipefail
          shopt -s nullglob
          summary="$GITHUB_STEP_SUMMARY"
          here=(app/src/main/baselineProfiles/*.txt app/src/main/generated/baselineProfiles/*.txt)
          {
            echo "### Baseline profile"
            echo ''
            echo "Generated: \`${{ steps.profile.outputs.path }}\`"
            echo ''
            echo "Committed = \`HEAD\`; generated = this run. Expected spread between two runs of"
            echo "the SAME tree: a single-digit rule delta, well under 1 KB. Only an order-of-"
            echo "magnitude change in the counts is a real change."
            echo ''
            echo '| file | committed bytes | generated bytes | Δ bytes | committed rules | generated rules | Δ rules | Δ startup |'
            echo '| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |'
          } >> "$summary"
          rules_delta=0
          for f in "${here[@]}"; do
            gen_bytes=$(wc -c < "$f")
            gen_rules=$(grep -c . "$f" || true)
            gen_hspl=$(grep -c '^HSPL' "$f" || true)
            if git cat-file -e "HEAD:$f" 2>/dev/null; then
              old_bytes=$(git show "HEAD:$f" | wc -c)
              old_rules=$(git show "HEAD:$f" | grep -c . || true)
              old_hspl=$(git show "HEAD:$f" | grep -c '^HSPL' || true)
              d_bytes=$(( gen_bytes - old_bytes ))
              d_rules=$(( gen_rules - old_rules ))
              d_hspl=$(( gen_hspl - old_hspl ))
              # Sum |Δ rules|, not the signed sum: with `mergeIntoMain` the two files can move
              # in opposite directions, and a signed sum would cancel real movement to zero.
              rules_delta=$(( rules_delta + ${d_rules#-} ))
              printf '| `%s` | %s | %s | %+d | %s | %s | %+d | %+d |\n' \
                "$f" "$old_bytes" "$gen_bytes" "$d_bytes" "$old_rules" "$gen_rules" "$d_rules" "$d_hspl" \
                >> "$summary"
            else
              # A path \`HEAD\` does not have at all: there is nothing to compare against, so
              # print the whole file as new rather than a delta against zero.
              rules_delta=$(( rules_delta + gen_rules ))
              printf '| `%s` | — new file | %s | — | — | %s | — | — |\n' \
                "$f" "$gen_bytes" "$gen_rules" >> "$summary"
            fi
          done
          {
            echo ''
            echo "Δ rules summed over every file, ignoring sign: **${rules_delta}**."
            if [ "$rules_delta" -le 50 ]; then
              echo "That is inside the spread above: generator noise (which methods the walk"
              echo "reached before this screen moved on), NOT a stale profile. Do not re-run to"
              echo "make the diff empty — re-running does not converge."
            else
              echo "That is beyond the spread above: compare these counts against the code change"
              echo "under review before committing anything."
            fi
            echo ''
            echo '```'
            git status --porcelain -- app/src/main >> "$summary" || true
            echo '```'
            echo ''
            echo "The profile is a checked-in input. Download the artifact and commit it — this"
            echo "job deliberately does not commit the file itself: a generated artifact that"
            echo "commits itself is an artifact nobody reviews."
          } >> "$summary"

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            app/src/main/baselineProfiles
            app/src/main/generated/baselineProfiles
            app/src/main/baseline-prof.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: baseline-profile-reports
          path: |
            benchmark/build/reports/**
            benchmark/build/outputs/**
            app/build/reports/**
